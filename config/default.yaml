# SpectreOps default configuration
llm:
  backend: ollama              # ollama | openai_compat
  base_url: http://127.0.0.1:11434
  model: qwen2.5-coder:14b     # pick per hardware: 7b ≈ 8GB RAM, 14b ≈ 12GB, 32b ≈ 24GB+
  small_model: qwen2.5:7b      # cheap tasks: summarization, dedup, triage
  temperature: 0.2
  max_context_tokens: 32768
  request_timeout: 300

agent:
  autonomy: supervised         # advisory | supervised | authorized
  max_tool_rounds: 40
  max_tool_timeout: 600        # seconds per tool execution
  max_retries: 2

scope:
  mode: none                   # none | passive_only | active | full
  targets: []                  # e.g. ["http://127.0.0.1:8080"]
  exclusions: []
  profile: normal              # stealth | normal | loud — noise/aggressiveness.
                               # stealth caps rate at 2/s, 1 connection, and runs
                               # nmap top-50 at -T2 with no version detection.
                               # normal is quiet-by-default (top-100, no -sV).
  rate_limit: 10               # requests/sec ceiling (profile may lower this)
  concurrency: 5
  require_approval_for: [exploit, destructive, auth_bypass]

runtime:
  data_dir: ~/.spectreops      # engagements, memory DBs, evidence, logs
  sandbox: auto                # auto | docker | bwrap | none  (docker: run docker/tools/build.sh)
  sandbox_network: host        # host (reach lab targets) | none (fully isolated)
  offline: true                # refuse any non-target egress when true
  redact_secrets: true

audit:
  enabled: true
  hash_chain: true             # each JSONL record hashes the previous one

# Optional: authenticated testing. Raw secrets are NEVER written here — each
# credential names an environment variable (token_env/value_env) or a key in the
# secrets store (secret). Credentials are only ever sent to the host they are
# configured for. Define multiple identities to test for broken authorization
# (BOLA/IDOR) by replaying one identity's request as another.
# auth:
#   active: primary
#   identities:
#     primary:
#       "127.0.0.1:3000":
#         kind: bearer            # bearer | header | cookie | basic | query
#         token_env: SPECTREOPS_TOKEN_PRIMARY
#     secondary:
#       "127.0.0.1:3000":
#         kind: header
#         header: X-API-Key
#         value_env: SPECTREOPS_KEY_SECONDARY
