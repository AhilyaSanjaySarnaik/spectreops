[project]
name = "spectreops"
version = "0.1.0"
description = "Local-first AI cybersecurity and red-team agent for authorized testing"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
spec = "spectreops.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
